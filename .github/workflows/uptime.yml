name: Uptime Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const targets = [
              { name: 'Frontend — eduplatformsoftware.com', url: 'https://eduplatformsoftware.com/' },
              { name: 'Login page', url: 'https://eduplatformsoftware.com/login' },
              { name: 'API health — Render', url: 'https://school-saas-backend-fnqi.onrender.com/api/health' },
            ];

            async function check(url) {
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  const t0 = Date.now();
                  const res = await fetch(url, { signal: AbortSignal.timeout(20000), redirect: 'follow' });
                  const ms = Date.now() - t0;
                  return { ok: res.ok, status: res.status, ms };
                } catch (e) {
                  if (attempt === 3) return { ok: false, status: 0, ms: -1, error: e.cause?.message || e.message };
                  await new Promise(r => setTimeout(r, 10000));
                }
              }
            }

            const results = [];
            for (const t of targets) results.push({ ...t, ...(await check(t.url)) });

            const lines = results.map(r =>
              `${r.ok ? '✅ UP' : '🚨 DOWN'} \`${r.status}\` — ${r.ok ? `${r.ms}ms` : `after 3 attempts${r.error ? ` (${r.error})` : ''}`} — ${r.name}`
            );
            console.log(lines.join('\n'));

            const allUp = results.every(r => r.ok);
            const label = 'uptime';
            const { owner, repo } = context.repo;
            const runAt = new Date().toISOString();
            const report = lines.join('\n');

            const { data: openIncidents } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 5,
            });

            if (allUp) {
              for (const iss of openIncidents) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: iss.number,
                  body: `✅ **Recovered** — all checks passing as of ${runAt}.\n\n${report}`,
                });
                await github.rest.issues.update({ owner, repo, issue_number: iss.number, state: 'closed' });
              }
              console.log('All endpoints healthy');
            } else {
              const summary = report;
              if (openIncidents.length) {
                const iss = openIncidents[0];
                await github.rest.issues.createComment({
                  owner, repo, issue_number: iss.number,
                  body: `⚠️ **Still failing** as of ${runAt}.\n\n${summary}`,
                });
              } else {
                try {
                  await github.rest.issues.createLabel({ owner, repo, name: label, color: 'a20025', description: 'Uptime monitor incidents' });
                } catch (e) { /* label likely exists */ }
                await github.rest.issues.create({
                  owner, repo,
                  title: `Uptime alert: a service is down (${new Date().toISOString()})`,
                  body: `The uptime monitor detected failures.\n\n${summary}`,
                  labels: [label],
                });
              }
              core.setFailed('One or more endpoints are down');
            }